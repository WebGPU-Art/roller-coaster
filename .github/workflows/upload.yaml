name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"
    - name: Install immutable dependencies
      run: |
        caps --ci --strict
        YARN_ENABLE_SCRIPTS=true yarn install --immutable
        caps verify --toolchain
    - name: Check Calcit source
      run: |
        calcit edit format
        git diff --exit-code -- calcit.cirru
        calcit --check-only --all-defs --format json
        calcit fix --workflow strict --verify
    - name: Build frontend
      run: |
        calcit js
        node --check js-out/app.main.mjs
        yarn vite build --base="https://cos-sh.tiye.me/${GITHUB_REPOSITORY}/"
    - name: Check current production revision
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: production
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
        if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Skip stale production revision ${GITHUB_SHA}."
        fi
    - name: Upload and verify frontend assets
      if: steps.production.outputs.current == 'true'
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ github.repository }}/
        public-base-url: https://cos-sh.tiye.me/${{ github.repository }}/
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}
    - name: Deploy to server
      if: steps.production.outputs.current == 'true'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
